<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Edson Henrique</title>
  <desc id="description">Edson Henrique, Montréal. Bold cream lettering on deep purple beside a playful arrangement of coral, mint and lavender architectural blocks.</desc>
  <defs>
