  <title id="title">Edson Henrique — engineering notes from Montréal</title>
  <desc id="desc">Senior software engineer in Montréal. Distributed systems, cloud platforms, and applied AI. Creator of UHIRED, a first-place Microsoft hackathon project in 2024.</desc>
  <defs>
